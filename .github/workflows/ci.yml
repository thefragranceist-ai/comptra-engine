name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: test
        run: npm test
      - name: demo (smoke)
        run: npm run demo
